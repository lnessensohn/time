<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Timer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f0f;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 20px;
      padding: 48px 56px;
      text-align: center;
      width: 360px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.5);
    }

    h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #666;
      margin-bottom: 36px;
    }

    .display {
      font-size: 72px;
      font-weight: 700;
      letter-spacing: 2px;
      font-variant-numeric: tabular-nums;
      color: #fff;
      margin-bottom: 12px;
      transition: color 0.3s;
    }

    .display.warning { color: #f59e0b; }
    .display.danger  { color: #ef4444; }

    .progress-ring {
      margin: 0 auto 32px;
      position: relative;
      width: 160px;
      height: 160px;
    }

    .progress-ring svg {
      transform: rotate(-90deg);
    }

    .progress-ring .track {
      fill: none;
      stroke: #2a2a2a;
      stroke-width: 6;
    }

    .progress-ring .fill {
      fill: none;
      stroke: #6366f1;
      stroke-width: 6;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.5s linear, stroke 0.3s;
    }

    .progress-ring .fill.warning { stroke: #f59e0b; }
    .progress-ring .fill.danger  { stroke: #ef4444; }

    .ring-time {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 32px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      transition: color 0.3s;
    }

    .ring-time.warning { color: #f59e0b; }
    .ring-time.danger  { color: #ef4444; }

    .input-row {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 32px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .input-group label {
      font-size: 10px;
      color: #555;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .input-group input {
      width: 64px;
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      font-size: 22px;
      font-weight: 600;
      text-align: center;
      padding: 8px 4px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-group input:focus { border-color: #6366f1; }

    .sep {
      font-size: 28px;
      font-weight: 300;
      color: #444;
      padding-top: 22px;
    }

    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    button {
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      padding: 12px 24px;
      transition: opacity 0.15s, transform 0.1s;
    }

    button:active { transform: scale(0.96); }
    button:disabled { opacity: 0.3; cursor: default; }

    #btnStart {
      background: #6366f1;
      color: #fff;
      flex: 1;
    }

    #btnStart.running {
      background: #374151;
    }

    #btnReset {
      background: #1f2937;
      color: #9ca3af;
    }

    .message {
      margin-top: 20px;
      font-size: 13px;
      color: #555;
      height: 18px;
    }
  </style>
</head>
<body>
<div class="card">
  <h1>Timer</h1>

  <div class="progress-ring">
    <svg width="160" height="160" viewBox="0 0 160 160">
      <circle class="track" cx="80" cy="80" r="70"/>
      <circle class="fill" id="ringFill" cx="80" cy="80" r="70"
              stroke-dasharray="439.82"
              stroke-dashoffset="0"/>
    </svg>
    <div class="ring-time" id="ringTime">00:00</div>
  </div>

  <div class="input-row">
    <div class="input-group">
      <label>Std</label>
      <input type="number" id="inputH" min="0" max="23" value="0" placeholder="00"/>
    </div>
    <div class="sep">:</div>
    <div class="input-group">
      <label>Min</label>
      <input type="number" id="inputM" min="0" max="59" value="5" placeholder="00"/>
    </div>
    <div class="sep">:</div>
    <div class="input-group">
      <label>Sek</label>
      <input type="number" id="inputS" min="0" max="59" value="0" placeholder="00"/>
    </div>
  </div>

  <div class="controls">
    <button id="btnStart">Start</button>
    <button id="btnReset">Reset</button>
  </div>

  <div class="message" id="message"></div>
</div>

<script>
  const ringFill = document.getElementById('ringFill');
  const ringTime = document.getElementById('ringTime');
  const btnStart = document.getElementById('btnStart');
  const btnReset = document.getElementById('btnReset');
  const message  = document.getElementById('message');
  const inputH   = document.getElementById('inputH');
  const inputM   = document.getElementById('inputM');
  const inputS   = document.getElementById('inputS');

  const CIRCUMFERENCE = 439.82;

  let total = 0;
  let remaining = 0;
  let interval = null;
  let running = false;

  function pad(n) { return String(n).padStart(2, '0'); }

  function formatTime(s) {
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    if (h > 0) return `${pad(h)}:${pad(m)}:${pad(sec)}`;
    return `${pad(m)}:${pad(sec)}`;
  }

  function updateRing(rem, tot) {
    const ratio = tot > 0 ? rem / tot : 1;
    const offset = CIRCUMFERENCE * (1 - ratio);
    ringFill.style.strokeDashoffset = offset;

    const cls = ratio <= 0.1 ? 'danger' : ratio <= 0.25 ? 'warning' : '';
    ringFill.className = 'fill ' + cls;
    ringTime.className = 'ring-time ' + cls;
  }

  function setDisplay(s, tot) {
    ringTime.textContent = formatTime(s);
    updateRing(s, tot);
  }

  function getInputSeconds() {
    const h = parseInt(inputH.value) || 0;
    const m = parseInt(inputM.value) || 0;
    const s = parseInt(inputS.value) || 0;
    return h * 3600 + m * 60 + s;
  }

  function setInputsDisabled(d) {
    inputH.disabled = d;
    inputM.disabled = d;
    inputS.disabled = d;
  }

  function tick() {
    remaining--;
    setDisplay(remaining, total);
    if (remaining <= 0) {
      clearInterval(interval);
      running = false;
      btnStart.textContent = 'Start';
      btnStart.classList.remove('running');
      setInputsDisabled(false);
      message.textContent = '✓ Zeit abgelaufen';
      playBeep();
    }
  }

  function start() {
    if (!running) {
      if (remaining === 0) {
        total = getInputSeconds();
        remaining = total;
        if (total === 0) { message.textContent = 'Bitte Zeit eingeben.'; return; }
      }
      message.textContent = '';
      running = true;
      btnStart.textContent = 'Pause';
      btnStart.classList.add('running');
      setInputsDisabled(true);
      setDisplay(remaining, total);
      interval = setInterval(tick, 1000);
    } else {
      clearInterval(interval);
      running = false;
      btnStart.textContent = 'Weiter';
      btnStart.classList.remove('running');
      message.textContent = 'Pausiert';
    }
  }

  function reset() {
    clearInterval(interval);
    running = false;
    remaining = 0;
    total = 0;
    btnStart.textContent = 'Start';
    btnStart.classList.remove('running');
    setInputsDisabled(false);
    message.textContent = '';
    ringTime.textContent = '00:00';
    ringFill.style.strokeDashoffset = 0;
    ringFill.className = 'fill';
    ringTime.className = 'ring-time';
  }

  function playBeep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      [0, 0.3, 0.6].forEach(delay => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = 880;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.4, ctx.currentTime + delay);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 0.25);
        osc.start(ctx.currentTime + delay);
        osc.stop(ctx.currentTime + delay + 0.25);
      });
    } catch(e) {}
  }

  btnStart.addEventListener('click', start);
  btnReset.addEventListener('click', reset);

  // clamp inputs
  [inputH, inputM, inputS].forEach(inp => {
    inp.addEventListener('change', () => {
      let v = parseInt(inp.value) || 0;
      v = Math.max(parseInt(inp.min), Math.min(parseInt(inp.max), v));
      inp.value = v;
    });
  });
</script>
</body>
</html>
